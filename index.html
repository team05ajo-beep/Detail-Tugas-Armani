
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giorgio Armani - Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Public Sans', sans-serif;
            background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 50%, #64748b 100%);
            background-attachment: fixed;
            color: #1a1a1a;
        }
        .armani-font {
            font-family: 'Bodoni Moda', serif;
            letter-spacing: -0.02em;
        }
        .armani-bg-deep {
            background-color: #0f172a; /* Deep charcoal/navy for contrast */
            border: 1px solid rgba(255,255,255,0.1);
        }
        .armani-border {
            border-color: #94a3b8;
        }
        .armani-accent {
            color: #f1f5f9; /* Bright accent */
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .armani-bg-deep {
                background-color: #1a1c22 !important;
                color: white !important;
            }
        }
    </style>
